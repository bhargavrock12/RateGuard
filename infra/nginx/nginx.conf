worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Round-robin is nginx's default and is what we want: NO ip_hash, NO least_conn.
    # Sticky routing would send a burst to one replica and the correctness proof
    # would stop exercising cross-node shared state.
    upstream gateways {
        server gateway-1:3000 max_fails=3 fail_timeout=10s;
        server gateway-2:3000 max_fails=3 fail_timeout=10s;
        server gateway-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Served by nginx itself; never reaches a gateway.
        location = /nginx-health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"nginx"}';
        }

        location / {
            # No trailing URI on proxy_pass: the path must reach the gateway
            # untouched, because the gateway owns the /v1/proxy prefix.
            proxy_pass http://gateways;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry only on a failure to CONNECT. Never retry a response:
            # re-sending a 429 to another replica would decrement the shared
            # bucket twice and break the exact-count proof.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 3s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            proxy_buffering off;
        }
    }
}