apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Fixed uid: the dashboard JSON references it directly.
    uid: rateguard-prometheus
    url: http://prometheus:9090
    isDefault: true
    # Read-only in the UI — a hand-edit would vanish on the next recreate.
    editable: false
    jsonData:
      timeInterval: 5s