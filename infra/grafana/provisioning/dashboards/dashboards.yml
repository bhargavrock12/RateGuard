apiVersion: 1

providers:
  - name: rateguard
    orgId: 1
    type: file
    disableDeletion: false
    # Re-reads the directory so host-side JSON edits appear without a restart.
    updateIntervalSeconds: 10
    # UI edits must not overwrite the provisioned file: this repo is the source of truth.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true