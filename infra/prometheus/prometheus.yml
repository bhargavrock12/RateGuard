global:
  # Fast on purpose: dashboards should feel live during a load test.
  # 15-30s is the right answer for a real fleet.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    stack: rateguard

scrape_configs:
  # Targets are the replicas DIRECTLY, never nginx: scraping through the load
  # balancer would sample one arbitrary replica's counters per scrape and every
  # rate() would show phantom resets.
  - job_name: rateguard-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-1:3000"]
        labels:
          replica: gateway-1
      - targets: ["gateway-2:3000"]
        labels:
          replica: gateway-2
      - targets: ["gateway-3:3000"]
        labels:
          replica: gateway-3

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]